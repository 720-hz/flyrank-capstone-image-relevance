capstone: "AI Image Understanding & Content Matching Engine"
number: 2
of: 5
status: complete

summary: >
  Vision-tags a 50-image corpus with Gemini, embeds image captions and
  blog posts into a shared semantic space, ranks candidate images per
  post, and runs every candidate through a mismatch guard (category
  sanity, similarity threshold, confidence floor) before anything is
  suggested. A validated JSON review API sits on top.

repo: https://github.com/720-hz/flyrank-capstone-image-relevance

real_run:
  mock_mode_used_for_final_result: false
  gemini_vision_model: gemini-3.5-flash-lite
  gemini_embedding_model: gemini-embedding-001
  images_tagged: 50
  images_failed: 0
  embeddings_generated: 62
  embeddings_failed: 0
  cost_log_rows: 196
  nominal_cost_usd: 0.0106
  actual_cost_usd: 0.0
  actual_cost_note: "Gemini free tier — cost_log records the standard paid-tier rate so the number means something if this is ever pointed at a billed project."

headline_metric:
  name: top1_precision
  value: "12/12 = 100%"
  eval_set_size: 12
  measured_by: scripts/eval.py
  same_code_path_as_api: true
  note: >
    First real run measured 83.3% (10/12). SIMILARITY_THRESHOLD was tuned
    against a mock embedder during development (0.55) and did not
    transfer to real gemini-embedding-001 output. Re-tuned to 0.74 against
    the real similarity distribution (10 true positives: 0.7649-0.8650;
    2 off-topic posts' top candidate: 0.6999-0.7120) and re-measured
    against the same already-computed real embeddings, no new API calls.
    Full writeup in EVIDENCE.md.

acceptance_probes:
  - id: 1
    description: Every vision response validates against the schema; a low-confidence response is flagged.
    status: pass
    note: >
      All 50 real responses validated. No image in this real corpus was
      ambiguous enough to trigger low_confidence organically (min
      confidence seen: 0.95) — mechanism itself verified in mock mode.
  - id: 2
    description: A fox post ranks a fox image first.
    status: pass
    evidence: "the-behavior-of-red-foxes -> fox-09.jpg, similarity 0.8496"
  - id: 3
    description: Forcing the wolf as a candidate for the fox post is rejected on category grounds.
    status: pass
    evidence: >
      evaluate_candidate() vs wolf-03.jpg for the-behavior-of-red-foxes:
      decision=rejected, reason="Animal category mismatch: expected fox,
      detected wolf.", despite similarity 0.7805 (above threshold).
  - id: 4
    description: A genuinely unsuitable post gets "no confident match."
    status: pass
    evidence: "Both off-topic posts -> no match, at SIMILARITY_THRESHOLD=0.74."
    caveat: "See known_limitations — protection here is threshold-based, not category-based."
  - id: 5
    description: A real top-1 precision number, computed by the same code path the live API uses.
    status: pass
    evidence: "12/12 = 100%, via scripts/eval.py calling app.lib.matching.suggest_for_post."
  - id: 6
    description: Every vision/embedding call, success or failure, is logged with cost.
    status: pass
    evidence: "196 cost_log rows, including 46 + 38 failed calls from deprecated models, none excluded."

known_limitations:
  - The mismatch guard's category-sanity check is a no-op for a post whose
    title names no known animal category (expected_categories() returns
    empty). Off-topic posts' protection against a wrong suggestion comes
    entirely from SIMILARITY_THRESHOLD, tuned with real margin against
    this 12-post corpus but not a structural guarantee for every possible
    off-topic post. See EVIDENCE.md "Known limitation."

docs:
  readme: README.md
  evidence: EVIDENCE.md
  buildlog: BUILDLOG.md
  design: DESIGN.md
  env_example: .env.example
